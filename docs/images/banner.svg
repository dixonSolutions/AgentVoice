<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Squeakr — voice control for coding agent CLIs">
  <title>Squeakr</title>
  <desc>Voice control for coding agent CLIs. Self-hosted, open source.</desc>
  <defs>
    <linearGradient id="bn-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#221f42"/>
      <stop offset="1" stop-color="#15142a"/>
    </linearGradient>
    <linearGradient id="bn-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="#16142c"/>

  <!-- the icon (site/assets/icon.svg), scaled to 220 px -->
  <g transform="translate(70 70) scale(0.4296875)">
    <rect width="512" height="512" rx="112" fill="url(#bn-tile)"/>
    <circle cx="196" cy="196" r="70" fill="url(#bn-body)"/>
    <circle cx="196" cy="196" r="40" fill="#6d4fd6"/>
    <path d="M96 304 C96 236 146 196 210 196 C272 196 316 238 352 296 C360 309 356 324 340 328 L210 356 C146 370 96 352 96 304 Z" fill="url(#bn-body)"/>
    <circle cx="262" cy="262" r="15" fill="#15142a"/>
    <circle cx="348" cy="314" r="14" fill="#ffffff"/>
    <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-width="22">
      <path d="M384 268 A52 52 0 0 1 384 356" opacity="0.95"/>
      <path d="M418 232 A100 100 0 0 1 418 392" opacity="0.55"/>
    </g>
  </g>

  <text x="340" y="172" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="92" font-weight="700" fill="#ffffff" letter-spacing="-2">Squeakr</text>
  <text x="344" y="226" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#c9c3e6">Voice control for coding agent CLIs. Self-hosted, open source.</text>
  <text x="344" y="276" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="24" fill="#8f88b8">npm install -g squeakr</text>
</svg>
