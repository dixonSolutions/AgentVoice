<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Squeakr">
  <title>Squeakr</title>
  <desc>A mouse in profile, squeaking.</desc>
  <defs>
    <linearGradient id="sq-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#221f42"/>
      <stop offset="1" stop-color="#15142a"/>
    </linearGradient>
    <linearGradient id="sq-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#sq-tile)"/>
  <!-- ear behind the head -->
  <circle cx="196" cy="196" r="70" fill="url(#sq-body)"/>
  <circle cx="196" cy="196" r="40" fill="#6d4fd6"/>
  <!-- head: round at the back, tapering to the nose -->
  <path d="M96 304 C96 236 146 196 210 196 C272 196 316 238 352 296 C360 309 356 324 340 328 L210 356 C146 370 96 352 96 304 Z" fill="url(#sq-body)"/>
  <circle cx="262" cy="262" r="15" fill="#15142a"/>
  <circle cx="348" cy="314" r="14" fill="#ffffff"/>
  <!-- the squeak -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-width="22">
    <path d="M384 268 A52 52 0 0 1 384 356" opacity="0.95"/>
    <path d="M418 232 A100 100 0 0 1 418 392" opacity="0.55"/>
  </g>
</svg>
