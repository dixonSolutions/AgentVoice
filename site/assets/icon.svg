<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="AgentVoice">
  <title>AgentVoice</title>
  <desc>A speech waveform resolving into a terminal caret.</desc>

  <defs>
    <linearGradient id="av-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#221f42"/>
      <stop offset="1" stop-color="#15142a"/>
    </linearGradient>
    <linearGradient id="av-wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>

  <!-- Tile ground sits between the manifest's background_color and theme_color
       (#1a1a2e) so the PWA splash never flashes a different colour than the icon. -->
  <rect width="512" height="512" rx="112" fill="url(#av-tile)"/>

  <!-- Waveform. Pill-capped and unevenly tall: speech is organic, so this is a
       voice trace rather than a tidy equaliser staircase. -->
    <g fill="url(#av-wave)">
      <rect x="104" y="204" width="32" height="104" rx="16"/>
      <rect x="156" y="180" width="32" height="152" rx="16"/>
      <rect x="208" y="194" width="32" height="124" rx="16"/>
      <rect x="260" y="154" width="32" height="204" rx="16"/>
      <rect x="312" y="178" width="32" height="156" rx="16"/>
    </g>

  <!-- The caret. Squared off and the only pure white in the mark, against the
       round violet wave — the one hard edge, and the whole point of it: what
       you say becomes what the terminal does. -->
  <rect x="372" y="138" width="36" height="236" rx="8" fill="#ffffff"/>
</svg>
