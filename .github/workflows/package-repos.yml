# Signed apt + dnf repositories on GitHub Pages (docs/43).
#
#   https://dixonsolutions.github.io/AgentVoice/apt   deb  …/apt stable main
#   https://dixonsolutions.github.io/AgentVoice/rpm   /etc/yum.repos.d/agentvoice.repo
#
# One Pages site holds both the AgentVoice landing page (site/ in this repo,
# served at /) and the repositories (/apt, /rpm, /agentvoice.asc,
# /packages.html). Every deploy replaces the whole site, so every run builds
# both.
#
# Three ways in:
#
#   workflow_call      from npm-publish.yml, right after the deb/rpm job has
#                      attached the new release's packages.
#   push               to main, touching site/ — republish the landing page
#                      (the latest release's packages are re-added, so the
#                      repositories carry over unchanged).
#   workflow_dispatch  by hand: republish, backfill older releases
#                      (tags: "v0.1.1 v0.1.2"), or a dry run that builds and
#                      verifies everything without deploying.
#
# Each run: take the packages from the GitHub Release(s), fetch the packages
# the live site already serves (so older versions survive), prune to the newest
# few, regenerate and sign all metadata, verify it with nothing but the public
# key, deploy.
#
# Deployed as a Pages artifact (actions/deploy-pages), NOT committed to a
# gh-pages branch: each version is four ~70 MB packages, and a branch would put
# hundreds of MB into every clone and every plain `git fetch` of this repo. The
# previous state is read back from the site instead (fetch-published.sh).
#
# Never publishes unsigned: no PACKAGE_SIGNING_KEY, or a key that cannot sign,
# fails a release run before anything is downloaded. A push or manual run
# without the key deploys the landing page alone — but only while no packages
# are published yet, so a missing key can never wipe live repositories.
name: package-repos

on:
  workflow_call:
    inputs:
      tags:
        description: 'Release tags whose packages to add, space-separated'
        type: string
        required: true
    secrets:
      # Optional here so the missing-key case fails with our message (pointing
      # at docs/43) rather than GitHub's generic one.
      PACKAGE_SIGNING_KEY:
        required: false
      PACKAGE_SIGNING_PASSPHRASE:
        required: false
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/package-repos.yml'
      - 'packaging/repos/**'
  workflow_dispatch:
    inputs:
      tags:
        description: 'Release tags to add, space-separated (e.g. "v0.1.1 v0.1.2"). Empty: the latest v* release.'
        type: string
        default: ''
      dry_run:
        description: 'Build, sign and verify, but do not deploy'
        type: boolean
        default: false

permissions: {}

jobs:
  publish:
    name: build, sign and deploy apt + dnf repositories
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # One job, not build + deploy: the next run reads back what this one
    # deployed, so a second run must not start building until this one's
    # deploy has finished. Never cancelled halfway.
    concurrency:
      group: package-repos
      cancel-in-progress: false
    permissions:
      contents: read   # checkout, download release assets
      pages: write     # deploy-pages
      id-token: write  # deploy-pages proves the deployment came from this run
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SITE_URL: https://dixonsolutions.github.io/AgentVoice
      KEEP_VERSIONS: '3'
      SITE_BUDGET_MB: '900'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install repository tools
        run: |
          set -eu
          # A private, throwaway keyring for every later step (the runner
          # context is not available in job-level env).
          echo "GNUPGHOME=${RUNNER_TEMP}/gnupg" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends apt-utils createrepo-c rpm gnupg

      # Without a key, only the landing page can go out — and only while there
      # are no published packages it would otherwise drop from the site.
      - name: Signing key available?
        id: key
        env:
          HAS_KEY: ${{ secrets.PACKAGE_SIGNING_KEY != '' }}
          # Release runs (workflow_call) and backfills always name tags; adding
          # packages needs the key. (github.event_name is the caller's event
          # inside a called workflow, so it cannot tell a release run apart.)
          REQUESTED: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          if [ "${HAS_KEY}" = true ]; then echo "present=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "present=false" >> "$GITHUB_OUTPUT"
          if [ -n "$(echo "${REQUESTED}" | xargs)" ]; then
            echo "::error::PACKAGE_SIGNING_KEY is not set — packages for ${REQUESTED} cannot be published. See docs/43-package-repos.md."
            exit 1
          fi
          # Only a 404 says nothing is published — fetch-published.sh's rule.
          # A site that cannot be reached, or any other answer, may well be
          # hiding live packages that a landing-page-only deploy would drop.
          if ! status="$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors \
              "${SITE_URL}/manifest.txt?cb=${GITHUB_RUN_ID}")"; then
            echo "::error::could not check ${SITE_URL}/manifest.txt — refusing to deploy without PACKAGE_SIGNING_KEY while it is unknown whether packages are published. See docs/43-package-repos.md."
            exit 1
          fi
          case "${status}" in
            404) ;;
            200)
              echo "::error::packages are published at ${SITE_URL} but PACKAGE_SIGNING_KEY is not set — refusing to deploy a site without them. See docs/43-package-repos.md."
              exit 1
              ;;
            *)
              echo "::error::${SITE_URL}/manifest.txt answered HTTP ${status}; cannot tell whether packages are published, and deploying without PACKAGE_SIGNING_KEY would drop them. See docs/43-package-repos.md."
              exit 1
              ;;
          esac
          echo "::warning::PACKAGE_SIGNING_KEY is not set — deploying the landing page only, no apt/dnf repositories (docs/43)."
          mkdir -p "${RUNNER_TEMP}/site"

      # First, so a missing or broken key fails before ~300 MB is downloaded.
      - name: Import the signing key
        if: steps.key.outputs.present == 'true'
        env:
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
          PACKAGE_SIGNING_PASSPHRASE: ${{ secrets.PACKAGE_SIGNING_PASSPHRASE }}
        run: packaging/repos/import-signing-key.sh

      - name: Resolve the releases to add
        id: tags
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Via env, never interpolated into the script: it is free text.
          REQUESTED: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          tags="$(echo "${REQUESTED}" | xargs)"
          if [ -z "${tags}" ]; then
            tags="$(gh release list --repo "${GITHUB_REPOSITORY}" --exclude-drafts --exclude-pre-releases \
              --limit 100 --json tagName --jq '.[].tagName' | grep -m1 -E '^v[0-9]' || true)"
            [ -n "${tags}" ] || { echo "::error::no v* release found"; exit 1; }
          fi
          for t in ${tags}; do
            if [[ ! "${t}" =~ ^v[0-9][0-9A-Za-z.+~-]*$ ]]; then
              echo "::error::'${t}' is not a release tag (expected v<version>)"
              exit 1
            fi
          done
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "Adding: ${tags}"

      - name: Download their .deb and .rpm
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/incoming"
          for t in ${TAGS}; do
            gh release download "${t}" --repo "${GITHUB_REPOSITORY}" --dir "${RUNNER_TEMP}/incoming" \
              --pattern '*.deb' --pattern '*.rpm' --clobber
          done
          ls -la "${RUNNER_TEMP}/incoming"

      - name: Fetch the packages already published
        if: steps.key.outputs.present == 'true'
        run: packaging/repos/fetch-published.sh "${SITE_URL}" "${RUNNER_TEMP}/site"

      - name: Build, sign and verify the repositories
        if: steps.key.outputs.present == 'true'
        env:
          BASE_URL: ${{ env.SITE_URL }}
        run: packaging/repos/build-repos.sh "${RUNNER_TEMP}/site" "${RUNNER_TEMP}/incoming"

      # The key is not needed past this point; do not leave it on the runner
      # for the upload and deploy steps.
      - name: Forget the signing key
        if: always()
        run: |
          gpgconf --kill gpg-agent || true
          rm -rf "${GNUPGHOME}"

      # The landing page goes on top: index.html, 404.html, assets/… at the
      # root. It must not ship anything under the repository paths.
      - name: Add the landing page
        run: |
          set -euo pipefail
          for reserved in apt rpm agentvoice.asc manifest.txt packages.html; do
            if [ -e "site/${reserved}" ]; then
              echo "::error::site/${reserved} would shadow the package repositories — rename it"
              exit 1
            fi
          done
          cp -a site/. "${RUNNER_TEMP}/site/"

      - name: Summary
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          DRY_RUN: ${{ inputs.dry_run == true }}
        run: |
          set -eu
          {
            echo "### apt + dnf repositories"
            echo
            echo "Added: \`${TAGS}\`$( [ "${DRY_RUN}" = true ] && echo ' — **dry run, not deployed**')"
            echo
            echo '| file | size |'
            echo '| --- | --- |'
            (cd "${RUNNER_TEMP}/site" && find apt/pool rpm/packages -type f -printf '| %p | %s |\n' 2>/dev/null | sort || true)
            echo
            echo "Site: ${SITE_URL}/"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v4
        if: ${{ !inputs.dry_run }}
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy to GitHub Pages
        id: deployment
        if: ${{ !inputs.dry_run }}
        uses: actions/deploy-pages@v4
