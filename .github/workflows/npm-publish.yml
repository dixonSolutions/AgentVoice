# npm package — check every PR, and release from main.
#
# Three ways a release happens, all ending in the same publish:
#
#   push to main   — if package.json's version is not on the registry yet, it
#                    is published and tagged. Bump the version in a PR and the
#                    merge ships it; merge anything else and nothing happens.
#   workflow_dispatch with a bump — bumps the version on main first, then the
#                    same path. For releasing without a version-bump PR.
#   a `v*` tag     — the explicit route, kept so an old tag still works.
#
# The registry is the source of truth for "has this shipped", so re-running a
# workflow, or pushing to main again, can never double-publish or fail on a
# version that is already out.
name: npm-publish

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump to apply to main before releasing'
        type: choice
        default: none
        options: [none, patch, minor, major]

concurrency:
  # Releases mutate main (version bump, tag) — never run two at once. PR checks
  # are safe to cancel; a half-finished release is not.
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: typecheck, lint, build, pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # --legacy-peer-deps: @openng/optimus-ui declares a peer on
      # @angular/cdk ^21 while the app is on Angular 22; scripts/setup.sh and
      # scripts/update.sh install the same way.
      # better-sqlite3 uses a prebuilt binary on ubuntu-latest / Node 22 and
      # falls back to node-gyp, which the runner has the toolchain for.
      - name: Install
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # dist/ (tsup bundle) + web/dist/ (Angular production build) — both are
      # in the published "files" allowlist, so the pack below is only
      # meaningful once they exist.
      - name: Build
        run: npm run build

      # --ignore-scripts: the build already ran above; prepublishOnly would
      # otherwise repeat the whole typecheck/lint/build cycle here.
      - name: Pack
        run: npm pack --ignore-scripts

      # The Vosk wake-word model is excluded by a "files" negation. It is 41 MB
      # and would more than double the tarball, so if it ever reappears the
      # package has silently regressed — fail here rather than on the registry.
      - name: Assert the wake-word model is not bundled
        run: |
          set -eu
          if npm pack --dry-run --ignore-scripts 2>&1 | grep -q 'vosk/model.tar.gz'; then
            echo "::error::web/dist/vosk/model.tar.gz is in the tarball — check the files negation in package.json"
            exit 1
          fi
          echo "wake-word model correctly excluded"

      - name: Show package contents
        run: npm pack --dry-run --ignore-scripts

      - uses: actions/upload-artifact@v5
        with:
          name: agentvoice-npm-tarball
          path: '*.tgz'
          if-no-files-found: error

  release:
    name: release
    # Everything except PR checks. Whether it actually publishes is decided by
    # the registry, below — not by the trigger.
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      # Pushing the version bump and the tag back to main.
      contents: write
      # npm provenance: the publish is signed with a Sigstore attestation tying
      # the tarball to this workflow run and this commit.
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          # Tags and the bump commit are pushed from here, so the checkout needs
          # a token with write access and the full history to push onto.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: 'https://registry.npmjs.org'

      # Manual release: move the version on main first, so the commit that
      # produced the published tarball is the one main points at.
      - name: Bump the version on main
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        run: |
          set -eu
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          npm version "${{ inputs.bump }}" --no-git-tag-version
          version="$(node -p "require('./package.json').version")"
          git add package.json package-lock.json
          # [skip ci]: this push would otherwise re-trigger the workflow. The
          # registry guard would stop it publishing twice anyway, but a second
          # pointless run is still noise.
          git commit -m "Release ${version} [skip ci]"
          git push origin HEAD:main

      - name: Resolve the version to release
        id: v
        run: |
          set -eu
          version="$(node -p "require('./package.json').version")"

          # A tag release must agree with package.json, or the thing published
          # is not the thing the tag names.
          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$version" != "$tag" ]; then
              echo "::error::tag v${tag} does not match package.json version ${version} (bump with 'npm version')"
              exit 1
            fi
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Releasing version ${version}"

      # The registry, not the trigger, decides whether there is anything to do.
      # This is what makes a push to main safe: merge a change with no version
      # bump and this step simply reports "already published" and stops.
      - name: Has this version already shipped?
        id: shipped
        run: |
          set -eu
          version="${{ steps.v.outputs.version }}"
          # Read the name from package.json rather than hardcoding it: this
          # guard silently stopped working when the package moved to the
          # @ratitisrad scope and this string still said "agentvoice", so it
          # asked the registry about a package that does not exist and always
          # answered "not published yet".
          name="$(node -p "require('./package.json').name")"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "${name}@${version} is already on the registry — nothing to publish."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "${name}@${version} is not published yet."
          fi

      - name: Install
        if: steps.shipped.outputs.already == 'false'
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 still bundles
      # npm 10.x, which has no idea what an OIDC token is and falls back to
      # looking for a _authToken it will not find.
      - name: Use an npm that speaks OIDC
        if: steps.shipped.outputs.already == 'false'
        run: npm install -g npm@latest

      # ── Authentication: token if one is configured, OIDC otherwise ───────
      #
      # Trusted publishing cannot create a package that does not exist yet:
      # the trusted publisher is configured *on a package*, so there is nothing
      # to attach it to until a first version is up. Every publish of
      # @ratitisrad/agentvoice so far has died on
      #   404 Not Found - PUT https://registry.npmjs.org/@ratitisrad%2fagentvoice
      # for exactly that reason.
      #
      # It cannot be bootstrapped by hand either. Publishing from a shell hits
      # the account's 2FA, and npm answers with a browser URL whose id it
      # redacts to `***` whenever stdout is not a TTY — so the OTP flow is
      # unrunnable from any non-interactive shell, and retrying only stacks up
      # failed auth attempts against the account.
      #
      # So: a granular access token breaks the deadlock once. Set NPM_TOKEN as
      # a repository secret and this step authenticates with it; delete the
      # secret once the package exists and Trusted Publishing is configured on
      # it, and the OIDC branch below takes over again with no further change.
      - name: Authenticate with the granular token
        if: steps.shipped.outputs.already == 'false' && env.NPM_TOKEN != ''
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          printf '//registry.npmjs.org/:_authToken=%s\n' "${NPM_TOKEN}" >> "$HOME/.npmrc"
          echo 'Publishing with the NPM_TOKEN repository secret.'

      # setup-node's registry-url always writes
      #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # into ~/.npmrc. With no NODE_AUTH_TOKEN that expands to an empty token,
      # npm reads it as "auth is already configured", never starts the OIDC
      # exchange, and fails with ENEEDAUTH. Drop the line and keep the
      # registry= line that registry-url also wrote.
      - name: Let npm reach for OIDC instead of an empty token
        if: steps.shipped.outputs.already == 'false' && env.NPM_TOKEN == ''
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          if [ -f "$HOME/.npmrc" ]; then
            sed -i '/_authToken/d' "$HOME/.npmrc"
            echo "~/.npmrc after stripping the auth line:"
            cat "$HOME/.npmrc"
          fi

      # prepublishOnly (typecheck + lint + build) runs as part of `npm publish`,
      # so dist/ and web/dist/ can never be stale in a published tarball.
      #
      # Authenticated by whichever of the two steps above ran. Under trusted
      # publishing provenance is automatic and the attestation is still signed;
      # a token publish does not get one, which is another reason to delete the
      # secret once the package exists.
      #
      # A granular token must have "Bypass two-factor authentication" enabled
      # or npm answers 403 here, and npm is restricting those tokens for direct
      # publishing from January 2027 — so the token is a bootstrap, not a
      # destination.
      - name: Publish
        if: steps.shipped.outputs.already == 'false'
        run: npm publish --access public

      # Tag after publishing, not before: a tag pointing at a release that
      # failed halfway is worse than no tag.
      - name: Tag the release
        if: steps.shipped.outputs.already == 'false' && github.ref_type != 'tag'
        run: |
          set -eu
          version="${{ steps.v.outputs.version }}"
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "v${version}" -m "AgentVoice v${version}"
          git push origin "v${version}"

      - name: Pack for the GitHub Release
        if: steps.shipped.outputs.already == 'false'
        run: npm pack --ignore-scripts

      - name: GitHub Release
        if: steps.shipped.outputs.already == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: AgentVoice v${{ steps.v.outputs.version }}
          body: |
            AgentVoice v${{ steps.v.outputs.version }} is on npm.

            ```bash
            npm install -g @ratitisrad/agentvoice     # then: agentvoice status
            npx @ratitisrad/agentvoice                # or run it once
            ```

            Or install the .deb / .rpm attached below — they bundle Node, so
            they work on distros that still ship Node 18.

            ```bash
            sudo apt install ./agentvoice_${{ steps.v.outputs.version }}_amd64.deb
            sudo dnf install ./agentvoice-${{ steps.v.outputs.version }}.x86_64.rpm
            ```

            The wake-word model is not bundled — run `agentvoice prepare-vosk`
            if you want wake words.
          files: '*.tgz'

  # ── System packages (docs/38, #58) ─────────────────────────────────────────
  #
  # Runs after the release so the .deb / .rpm are attached to the same GitHub
  # Release the npm tarball is. One job per architecture: better-sqlite3's
  # binding is ABI- and arch-bound and the bundled Node has to match it, which
  # is also why the runtime is fetched here rather than depended on.
  packages:
    name: deb + rpm (${{ matrix.arch }})
    if: github.event_name != 'pull_request'
    needs: release
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            node_arch: x64
          # arm64 from day one — Raspberry Pi and Graviton are exactly the
          # "always-on box in the corner" this is for. Built on a native
          # runner so the binding is compiled, not cross-guessed.
          - arch: arm64
            runner: ubuntu-24.04-arm
            node_arch: arm64
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Resolve the version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # The exact runtime that goes in the package. Pinned to the major the
      # package.json `engines` field requires, not "whatever latest is".
      - name: Fetch the Node runtime to bundle
        id: node
        run: |
          set -eu
          major="$(node -p "require('./package.json').engines.node.replace(/[^0-9]/g,'')")"
          version="$(curl -fsSL https://nodejs.org/dist/index.json \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{
                const major=process.argv[1];
                const hit=JSON.parse(d).find(v=>v.lts&&v.version.startsWith("v"+major+"."));
                if(!hit){console.error("no LTS release for Node "+major);process.exit(1)}
                console.log(hit.version);
              })' "$major")"
          dir="node-${version}-linux-${{ matrix.node_arch }}"
          curl -fsSL -o node.tar.xz "https://nodejs.org/dist/${version}/${dir}.tar.xz"
          tar -xf node.tar.xz
          echo "dir=${PWD}/${dir}" >> "$GITHUB_OUTPUT"
          echo "Bundling ${version} (${{ matrix.node_arch }})"

      - name: Stage the package payload
        run: packaging/stage.sh "${{ steps.node.outputs.dir }}"

      # The model is 41 MB and cannot live under /usr/lib anyway — the same
      # assertion the npm job makes, for the same reason.
      - name: Assert the wake-word model is not packaged
        run: |
          set -eu
          if [ -f packaging/root/usr/lib/agentvoice/web/dist/vosk/model.tar.gz ]; then
            echo "::error::the wake-word model is in the staging tree — packaging/stage.sh should have removed it"
            exit 1
          fi
          echo "wake-word model correctly excluded"

      - name: Install nfpm
        run: |
          set -eu
          version=2.41.3
          arch=$([ "${{ matrix.arch }}" = arm64 ] && echo arm64 || echo x86_64)
          curl -fsSL -o nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${version}/nfpm_${version}_Linux_${arch}.tar.gz"
          tar -xzf nfpm.tar.gz nfpm
          sudo install -m 0755 nfpm /usr/local/bin/nfpm

      - name: Build the .deb and the .rpm
        env:
          PKG_VERSION: ${{ steps.v.outputs.version }}
          PKG_ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          cd packaging
          PKG_FORMAT=deb ./stage.sh "${{ steps.node.outputs.dir }}" >/dev/null
          nfpm package --config nfpm.yaml --packager deb --target ../
          PKG_FORMAT=rpm ./stage.sh "${{ steps.node.outputs.dir }}" >/dev/null
          nfpm package --config nfpm.yaml --packager rpm --target ../
          ls -la ../*.deb ../*.rpm

      # A package that does not install is not a release artefact. amd64 can be
      # checked on the runner itself; the arm64 runner is native too.
      - name: Install it and run the CLI
        run: |
          set -eu
          sudo apt-get install -y ./agentvoice_*_${{ matrix.arch }}.deb
          agentvoice --version
          # The install mode has to come back as `system`, or the Serve page
          # would offer an npm update for a package-manager install, and
          # `agentvoice update` would install a second copy the service does
          # not run (docs/38). Parsed rather than grepped: the output is
          # pretty-printed JSON.
          mode="$(agentvoice status --json | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).install.mode')"
          echo "install mode: ${mode}"
          [ "${mode}" = system ]
          sudo apt-get remove -y agentvoice

      - uses: actions/upload-artifact@v5
        with:
          name: agentvoice-packages-${{ matrix.arch }}
          path: |
            *.deb
            *.rpm
          if-no-files-found: error

      - name: Attach to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          files: |
            *.deb
            *.rpm
